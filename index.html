<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Arena Battle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 100%);
      color: #ffffff;
      overflow-x: hidden;
    }

    .overlay {
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .overlay h2 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .team-select {
      display: flex;
      gap: 2rem;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .team-select {
        flex-direction: column;
        gap: 1rem;
      }
    }

    .team {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.5rem;
      border: 2px solid #374151;
    }

    .team:nth-child(1) {
      border-color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
    }

    .team:nth-child(2) {
      border-color: #60a5fa;
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
    }

    .team h3 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: clamp(1rem, 3vw, 1.3rem);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 1rem 0;
    }

    .char-btn {
      width: 60px;
      height: 60px;
      font-size: 28px;
      background: #333;
      border: 2px solid #666;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: white;
    }

    .char-btn:hover {
      background: #555;
      transform: scale(1.1);
      border-color: #999;
    }

    .char-btn:active {
      transform: scale(0.95);
    }

    .char-btn.selected-p1 {
      background: #4ade80;
      border-color: #4ade80;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
    }

    .char-btn.selected-p2 {
      background: #60a5fa;
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
    }

    .selection-info {
      text-align: center;
      margin-bottom: 1rem;
      color: #a1a1aa;
      font-size: clamp(0.8rem, 2vw, 1rem);
    }

    .team-counter {
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #a1a1aa;
    }

    .start-btn {
      background: linear-gradient(45deg, #f59e0b, #ef4444);
      border: none;
      padding: 1rem 2rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
    }

    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .arena-container {
      width: 100vw;
      height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      gap: 0.5rem;
    }

    .info-header {
      text-align: center;
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hp-area {
      display: flex;
      justify-content: center;
      gap: clamp(1rem, 5vw, 3rem);
      flex-wrap: wrap;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 800px;
    }

    .team-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 150px;
    }

    .character-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 200px;
    }

    .hp-bar-container {
      width: 100%;
      position: relative;
    }

    .hp-bar {
      background-color: #333;
      height: 16px;
      border-radius: 8px;
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #374151;
    }

    .hp-fill {
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
      height: 100%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }

    .character-label {
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    canvas {
      border: 3px solid #f59e0b;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
      max-width: calc(100vw - 2rem);
      max-height: calc(100vh - 200px);
      background: #000;
    }

    .game-over {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .game-over.show {
      display: flex;
    }

    .game-over h2 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (max-width: 480px) {
      .character-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      
      .char-btn {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="characterSelect">
    <h2>⚔️ Emoji Arena Battle ⚔️</h2>
    <div class="selection-info">
      Select up to 5 characters per team
    </div>
    <div class="team-select">
      <div class="team">
        <h3>🟢 Player 1</h3>
        <div class="character-grid" id="player1Chars"></div>
        <div class="team-counter">
          Selected: <span id="p1Count">0</span>/5
        </div>
      </div>
      <div class="team">
        <h3>🔵 Player 2</h3>
        <div class="character-grid" id="player2Chars"></div>
        <div class="team-counter">
          Selected: <span id="p2Count">0</span>/5
        </div>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()" id="startBtn" disabled>Start Battle</button>
  </div>

  <div class="arena-container">
    <div class="info-header" id="matchInfo"></div>
    <div class="hp-area">
      <div class="team-column" id="player1HP"></div>
      <div class="team-column" id="player2HP"></div>
    </div>
    <canvas id="arena"></canvas>
  </div>

  <div class="game-over" id="gameOver">
    <h2 id="winnerText"></h2>
    <button class="start-btn" onclick="resetGame()">Play Again</button>
  </div>

  <script>
    // Character definitions
    const characters = [
      { emoji: "😈", name: "Demonlord" },
      { emoji: "👽", name: "Terestro" },
      { emoji: "👾", name: "Gamemaster" },
      { emoji: "💀", name: "Deathblow" },
      { emoji: "🤡", name: "Mimic" },
      { emoji: "🎃", name: "Tricker" },
      { emoji: "👹", name: "Grinch" },
      { emoji: "👼🏻", name: "Angerus" },
      { emoji: "🤵🏻", name: "Magico" },
      { emoji: "🐯", name: "Clawhard" },
      { emoji: "🦁", name: "Kingstone" },
      { emoji: "🐺", name: "Moonhowl" },
      { emoji: "🐻‍❄️", name: "Antarticus" },
      { emoji: "🐼", name: "Black Spot" },
      { emoji: "🦊", name: "Frenzy" },
      { emoji: "🐰", name: "Hopper" }
    ];

    let selectedP1 = [];
    let selectedP2 = [];

    function createCharacterGrid(containerId, team) {
      console.log('Creating grid for team', team);
      const container = document.getElementById(containerId);
      
      if (!container) {
        console.error('Container not found:', containerId);
        return;
      }

      container.innerHTML = "";
      
      characters.forEach((char, index) => {
        const btn = document.createElement("button");
        btn.className = "char-btn";
        btn.textContent = char.emoji;
        btn.title = char.name;
        btn.type = "button";
        
        // Simple click handler
        btn.onclick = function(event) {
          event.preventDefault();
          event.stopPropagation();
          console.log('Clicked:', char.name, 'for team', team);
          selectCharacter(char, team);
        };
        
        container.appendChild(btn);
        console.log('Added button for', char.name);
      });
      
      console.log('Grid complete with', container.children.length, 'buttons');
    }

    function selectCharacter(char, team) {
      console.log('Selecting character:', char.name, 'for team', team);
      
      if (team === 1) {
        const index = selectedP1.findIndex(c => c.emoji === char.emoji);
        if (index !== -1) {
          selectedP1.splice(index, 1);
          console.log('Removed from P1:', char.name);
        } else if (selectedP1.length < 5 && !selectedP2.some(c => c.emoji === char.emoji)) {
          selectedP1.push(char);
          console.log('Added to P1:', char.name);
        }
      } else if (team === 2) {
        const index = selectedP2.findIndex(c => c.emoji === char.emoji);
        if (index !== -1) {
          selectedP2.splice(index, 1);
          console.log('Removed from P2:', char.name);
        } else if (selectedP2.length < 5 && !selectedP1.some(c => c.emoji === char.emoji)) {
          selectedP2.push(char);
          console.log('Added to P2:', char.name);
        }
      }
      
      updateDisplay();
    }

    function updateDisplay() {
      // Update counters
      document.getElementById('p1Count').textContent = selectedP1.length;
      document.getElementById('p2Count').textContent = selectedP2.length;
      
      // Update button highlights
      document.querySelectorAll('.char-btn').forEach(btn => {
        btn.classList.remove('selected-p1', 'selected-p2');
        const emoji = btn.textContent;
        
        if (selectedP1.some(c => c.emoji === emoji)) {
          btn.classList.add('selected-p1');
        }
        if (selectedP2.some(c => c.emoji === emoji)) {
          btn.classList.add('selected-p2');
        }
      });
      
      // Update start button
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = selectedP1.length === 0 || selectedP2.length === 0;
      
      console.log('Display updated. P1:', selectedP1.length, 'P2:', selectedP2.length);
    }

    function startGame() {
      if (selectedP1.length === 0 || selectedP2.length === 0) {
        alert('Please select at least one character for each team!');
        return;
      }
      
      console.log('Starting game with:', selectedP1.map(c => c.name), 'vs', selectedP2.map(c => c.name));
      alert(`Game starting!\nP1: ${selectedP1.map(c => c.name).join(', ')}\nP2: ${selectedP2.map(c => c.name).join(', ')}`);
      
      // Hide selection overlay and show arena
      document.getElementById('characterSelect').style.display = 'none';
      document.querySelector('.arena-container').style.display = 'flex';
      
      // Set match info
      const info = selectedP1.length > 1 || selectedP2.length > 1 ?
        `Team 1 (${selectedP1.length}) vs Team 2 (${selectedP2.length})` : 
        `${selectedP1[0].emoji} VS ${selectedP2[0].emoji}`;
      document.getElementById('matchInfo').textContent = info;
      
      // Create basic HP displays
      createHPDisplays();
      
      // Initialize canvas
      const canvas = document.getElementById('arena');
      canvas.width = Math.min(window.innerWidth * 0.9, 1000);
      canvas.height = Math.min(window.innerHeight * 0.6, 600);
      const ctx = canvas.getContext('2d');
      
      // Draw simple arena
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Arena Ready!', canvas.width/2, canvas.height/2);
    }

    function createHPDisplays() {
      const hp1 = document.getElementById('player1HP');
      const hp2 = document.getElementById('player2HP');
      hp1.innerHTML = '';
      hp2.innerHTML = '';
      
      selectedP1.forEach(char => {
        const div = document.createElement('div');
        div.className = 'character-status';
        div.innerHTML = `
          <div class="character-label">${char.emoji} ${char.name}</div>
          <div class="hp-bar-container">
            <div class="hp-bar">
              <div class="hp-fill" style="width: 100%"></div>
            </div>
          </div>
        `;
        hp1.appendChild(div);
      });
      
      selectedP2.forEach(char => {
        const div = document.createElement('div');
        div.className = 'character-status';
        div.innerHTML = `
          <div class="character-label">${char.emoji} ${char.name}</div>
          <div class="hp-bar-container">
            <div class="hp-bar">
              <div class="hp-fill" style="width: 100%"></div>
            </div>
          </div>
        `;
        hp2.appendChild(div);
      });
    }

    function resetGame() {
      selectedP1 = [];
      selectedP2 = [];
      document.getElementById('gameOver').classList.remove('show');
      document.getElementById('characterSelect').style.display = 'flex';
      document.querySelector('.arena-container').style.display = 'none';
      updateDisplay();
    }

    // Initialize the game
    console.log('Initializing game...');
    createCharacterGrid('player1Chars', 1);
    createCharacterGrid('player2Chars', 2);
    updateDisplay();
    console.log('Game initialized!');

    // Test function to verify everything works
    window.testClick = function() {
      console.log('Manual test click');
      selectCharacter(characters[0], 1);
    };

    console.log('You can test manually by typing: testClick()');
  </script>
</body>
</html>
