<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Arena Battle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 100%);
      color: #ffffff;
      overflow-x: hidden;
    }

    .overlay {
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .overlay h2 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .team-select {
      display: flex;
      gap: 2rem;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .team-select {
        flex-direction: column;
        gap: 1rem;
      }
    }

    .team {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.5rem;
      border: 2px solid #374151;
    }

    .team:nth-child(1) {
      border-color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
    }

    .team:nth-child(2) {
      border-color: #60a5fa;
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
    }

    .team h3 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: clamp(1rem, 3vw, 1.3rem);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 1rem 0;
    }

    .char-btn {
      width: 60px;
      height: 60px;
      font-size: 28px;
      background: #333;
      border: 2px solid #666;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: white;
    }

    .char-btn:hover {
      background: #555;
      transform: scale(1.1);
      border-color: #999;
    }

    .char-btn:active {
      transform: scale(0.95);
    }

    .char-btn.selected-p1 {
      background: #4ade80;
      border-color: #4ade80;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
    }

    .char-btn.selected-p2 {
      background: #60a5fa;
      border-color: #60a5fa;
      box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
    }

    .selection-info {
      text-align: center;
      margin-bottom: 1rem;
      color: #a1a1aa;
      font-size: clamp(0.8rem, 2vw, 1rem);
    }

    .team-counter {
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #a1a1aa;
    }

    .start-btn {
      background: linear-gradient(45deg, #f59e0b, #ef4444);
      border: none;
      padding: 1rem 2rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
    }

    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .arena-container {
      width: 100vw;
      height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      gap: 0.5rem;
    }

    .info-header {
      text-align: center;
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #4ade80, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hp-area {
      display: flex;
      justify-content: center;
      gap: clamp(1rem, 5vw, 3rem);
      flex-wrap: wrap;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 800px;
    }

    .team-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 150px;
    }

    .character-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 200px;
    }

    .hp-bar-container {
      width: 100%;
      position: relative;
    }

    .hp-bar {
      background-color: #333;
      height: 16px;
      border-radius: 8px;
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #374151;
    }

    .hp-fill {
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
      height: 100%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }

    .hp-fake {
      background-color: #fbbf24;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 6px;
    }

    .hp-shield {
      background-color: #e5e7eb;
      height: 100%;
      position: absolute;
      top: 0;
      right: 0;
      border-radius: 6px;
    }

    .character-label {
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicators {
      display: flex;
      gap: 4px;
      font-size: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-indicator {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      border: 1px solid #374151;
    }

    canvas {
      border: 3px solid #f59e0b;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
      max-width: calc(100vw - 2rem);
      max-height: calc(100vh - 200px);
      background: #000;
    }

    .game-over {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .game-over.show {
      display: flex;
    }

    .game-over h2 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .death-animation {
      position: absolute;
      pointer-events: none;
      font-size: 48px;
      animation: deathPop 2s ease-out forwards;
    }

    @keyframes deathPop {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(2) rotate(180deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    .hells-trial {
      animation: hellsTrial 1s infinite;
    }

    @keyframes hellsTrial {
      0%, 100% { background-color: rgba(255, 0, 0, 0.1); }
      50% { background-color: rgba(255, 0, 0, 0.3); }
    }

    @media (max-width: 480px) {
      .character-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      
      .char-btn {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="characterSelect">
    <h2>⚔️ Emoji Arena Battle ⚔️</h2>
    <div class="selection-info">
      Select up to 5 characters per team
    </div>
    <div class="team-select">
      <div class="team">
        <h3>🟢 Player 1</h3>
        <div class="character-grid" id="player1Chars"></div>
        <div class="team-counter">
          Selected: <span id="p1Count">0</span>/5
        </div>
      </div>
      <div class="team">
        <h3>🔵 Player 2</h3>
        <div class="character-grid" id="player2Chars"></div>
        <div class="team-counter">
          Selected: <span id="p2Count">0</span>/5
        </div>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()" id="startBtn" disabled>Start Battle</button>
  </div>

  <div class="arena-container">
    <div class="info-header" id="matchInfo"></div>
    <div class="hp-area">
      <div class="team-column" id="player1HP"></div>
      <div class="team-column" id="player2HP"></div>
    </div>
    <canvas id="arena"></canvas>
  </div>

  <div class="game-over" id="gameOver">
    <h2 id="winnerText"></h2>
    <button class="start-btn" onclick="resetGame()">Play Again</button>
  </div>

  <script>
    // Character definitions
    const characters = [
      { emoji: "😈", name: "Demonlord" },
      { emoji: "👽", name: "Terestro" },
      { emoji: "👾", name: "Gamemaster" },
      { emoji: "💀", name: "Deathblow" },
      { emoji: "🤡", name: "Mimic" },
      { emoji: "🎃", name: "Tricker" },
      { emoji: "👹", name: "Grinch" },
      { emoji: "👼🏻", name: "Angerus" },
      { emoji: "🤵🏻", name: "Magico" },
      { emoji: "🐯", name: "Clawhard" },
      { emoji: "🦁", name: "Kingstone" },
      { emoji: "🐺", name: "Moonhowl" },
      { emoji: "🐻‍❄️", name: "Antarticus" },
      { emoji: "🐼", name: "Black Spot" },
      { emoji: "🦊", name: "Frenzy" },
      { emoji: "🐰", name: "Hopper" }
    ];

    let selectedP1 = [];
    let selectedP2 = [];
    let ctx, canvas;
    let charactersInArena = [];
    let projectiles = [];
    let gameRunning = false;
    let gameTime = 0;
    let soundEnabled = true;

    // Audio system
    class AudioManager {
      constructor() {
        this.sounds = {};
        this.createSounds();
      }

      createSounds() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      playSound(type, frequency = 440, duration = 0.1) {
        if (!soundEnabled || !this.audioContext) return;
        
        try {
          const oscillator = this.audioContext.createOscillator();
          const gainNode = this.audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(this.audioContext.destination);
          
          oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
          oscillator.type = 'sine';
          
          gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
          
          oscillator.start(this.audioContext.currentTime);
          oscillator.stop(this.audioContext.currentTime + duration);
        } catch(e) {
          // Silent fail for audio issues
        }
      }

      shoot() { this.playSound('shoot', 660, 0.1); }
      hit() { this.playSound('hit', 880, 0.15); }
      bounce() { this.playSound('bounce', 220, 0.1); }
      death() { this.playSound('death', 110, 0.5); }
      ability() { this.playSound('ability', 1100, 0.2); }
    }

    const audio = new AudioManager();

    // Projectile class
    class Projectile {
      constructor(x, y, vx, vy, emoji, damage, owner, type = 'basic', data = {}) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.emoji = emoji;
        this.damage = damage;
        this.owner = owner;
        this.type = type;
        this.data = { ...data };
        this.bounces = 0;
        this.maxBounces = data.maxBounces || 0; // Default no bouncing
        this.lifetime = data.lifetime || Infinity;
        this.age = 0;
        this.size = data.size || 16;
        this.canHitOwner = data.canHitOwner || false;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.age++;

        if (this.age > this.lifetime) {
          // Handle skull lifetime expiry
          if (this.type === "dangerSkull") {
            this.owner.abilityData.activeSkulls--;
          }
          return false;
        }

        // Border collision
        const margin = this.size;
        let bounced = false;
        let hitSide = null;

        if (this.x <= margin) {
          this.x = margin;
          this.vx *= -1;
          bounced = true;
          hitSide = 'left';
        } else if (this.x >= canvas.width - margin) {
          this.x = canvas.width - margin;
          this.vx *= -1;
          bounced = true;
          hitSide = 'right';
        }

        if (this.y <= margin) {
          this.y = margin;
          this.vy *= -1;
          bounced = true;
          hitSide = 'top';
        } else if (this.y >= canvas.height - margin) {
          this.y = canvas.height - margin;
          this.vy *= -1;
          bounced = true;
          hitSide = 'bottom';
        }

        if (bounced) {
          this.handleWallHit(hitSide);
          
          if (this.type === "fire") {
            // Fire projectiles stop on wall hit
            if (this.data.wallsHitTracker) {
              this.data.wallsHitTracker.add(hitSide);
              if (this.data.wallsHitTracker.size === 4) {
                // All 4 walls hit - trigger Hell's Trial
                this.owner.abilityData.hellsTrialTriggers++;
                this.owner.abilityData.hellsTrialActive = true;
                
                // Activate Hell's Trial for all enemies
                charactersInArena.forEach(c => {
                  if (c.team !== this.owner.team) {
                    c.abilityData.hellsTrialActive = true;
                  }
                });
                
                this.data.wallsHitTracker.clear(); // Reset for next trigger
              }
            }
            return false; // Fire stops on wall hit
          }
          
          if (this.type === "boulder") {
            // Boulder hits wall - split
            return this.handleBoulderSplit();
          }
          
          if (this.type === "frozeflake") {
            this.bounces++;
            if (this.bounces >= 5) {
              return false; // Disappears after 5 bounces
            }
          }
          
          if (this.type === "coin") {
            this.data.bounceCount++;
            if (this.data.bounceCount > this.maxBounces) {
              return false;
            }
            this.data.directHit = false; // No longer direct hit after bouncing
          }
          
          // Other projectiles bounce normally
          if (this.type === "redBall" || this.type === "bat" || this.type === "dangerSkull" || this.type === "moon") {
            // These continue bouncing
            audio.bounce();
          }
        }

        return true;
      }

      handleWallHit(side) {
        // Specific wall hit behaviors
      }

      handleBoulderSplit() {
        const currentSize = this.data.boulderSize;
        
        if (currentSize === "giant") {
          // Split into 2 medium boulders
          for (let i = 0; i < 2; i++) {
            const newBoulder = new Projectile(
              this.x, this.y,
              (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
              "🪨", 4, this.owner, "boulder",
              { size: this.size * 0.75, boulderSize: "medium" }
            );
            projectiles.push(newBoulder);
          }
        } else if (currentSize === "medium") {
          // Split into 2 small rocks
          for (let i = 0; i < 2; i++) {
            const newRock = new Projectile(
              this.x, this.y,
              (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
              "🪨", 2, this.owner, "boulder",
              { size: this.size * 0.5, boulderSize: "small" }
            );
            projectiles.push(newRock);
          }
        }
        // Small rocks just disappear
        
        return false; // Remove original boulder
      }

      draw(ctx) {
        ctx.save();
        ctx.font = `${this.size * 2}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        // Add glow for special projectiles
        if (this.type === 'fire') {
          ctx.shadowColor = "#ff4444";
          ctx.shadowBlur = 10;
        } else if (this.type === 'enhancedStar') {
          ctx.shadowColor = "#ffff44";
          ctx.shadowBlur = 8;
        } else if (this.type === 'fullMoon') {
          ctx.shadowColor = "#ffffff";
          ctx.shadowBlur = 15;
        }
        
        ctx.fillText(this.emoji, this.x, this.y);
        ctx.restore();
      }

      checkCollision(character) {
        const dx = this.x - character.x;
        const dy = this.y - character.y;
        const distance = Math.hypot(dx, dy);
        return distance < (this.size + character.size);
      }
    }

    // Enhanced Character class with all abilities
    class ArenaCharacter {
      constructor(emoji, name, x, y, team) {
        this.emoji = emoji;
        this.name = name;
        this.x = x;
        this.y = y;
        this.vx = (Math.random() * 2 - 1) * 2;
        this.vy = (Math.random() * 2 - 1) * 2;
        this.angle = 0;
        this.team = team;
        this.hp = 100;
        this.maxHp = 100;
        this.fakeHp = 0;
        this.shield = 0;
        this.size = 16;
        this.lastAbilityTime = 0;
        this.statusEffects = new Map();
        this.abilityData = {};
        this.isDead = false;
        this.frozen = false;
        this.frozenUntil = 0;
        this.invulnerable = false;
        this.invulnerableUntil = 0;
        this.speed = 2;
        this.originalSize = 16;

        this.initializeAbilities();
      }

      initializeAbilities() {
        switch(this.emoji) {
          case "😈": // Demonlord
            this.abilityData = {
              wallsHit: new Set(),
              hellsTrialTriggers: 0,
              hellsTrialActive: false,
              lastHellsTrialDamage: 0
            };
            break;
          case "👽": // Terestro
            this.abilityData = {
              enhancedStarHits: 0,
              overloadActive: false,
              overloadBarrageCount: 0,
              lastBlinkTime: 0,
              overloadComplete: false
            };
            break;
          case "👾": // Gamemaster
            this.abilityData = {
              coinsCollected: 0,
              gameBusterActive: false,
              gameBusterShots: 0
            };
            break;
          case "💀": // Deathblow
            this.abilityData = {
              enemyHits: 0,
              activeSkulls: 0
            };
            break;
          case "🤡": // Mimic
            this.abilityData = {
              ballBounces: 0,
              mimicking: false,
              mimicUntil: 0,
              lastMimicTime: 0,
              originalEmoji: "🤡",
              balloonCount: 0,
              hasActiveBall: false
            };
            break;
          case "🎃": // Tricker
            this.abilityData = {
              webs: [],
              clonePosition: null,
              bounceCount: 0,
              hasClone: false,
              hasBat: false
            };
            break;
          case "👹": // Grinch
            this.abilityData = {
              bloodDrops: [],
              bloodCollected: 0,
              cooldownReduced: false
            };
            break;
          case "👼🏻": // Angerus
            this.abilityData = {
              phase: 'black',
              blockIndex: 0,
              consecutiveDamage: 0,
              lastDamageTime: 0,
              phaseComplete: false,
              blackComplete: false,
              whiteComplete: false
            };
            break;
          case "🤵🏻": // Magico
            this.abilityData = {
              cardIndex: 0,
              spadeActive: false,
              clubsActive: false
            };
            break;
          case "🐯": // Clawhard
            this.abilityData = {
              windslashCount: 1,
              enemyHits: 0,
              lifeSurgeUsed: false
            };
            break;
          case "🦁": // Kingstone
            this.abilityData = {
              pride: [],
              enemyHits: 0
            };
            break;
          case "🐺": // Moonhowl
            this.abilityData = {
              moonHits: 0,
              fullMoonActive: false,
              wolfsenseActive: false,
              buffActive: false,
              buffUntil: 0,
              wolfsenseTarget: null
            };
            break;
          case "🐻‍❄️": // Antarticus
            this.abilityData = {
              frozenHits: 0,
              executionReady: false
            };
            break;
          case "🐼": // Black Spot
            this.abilityData = {
              leaves: [],
              hitCount: 0,
              boostMode: false,
              boostUntil: 0,
              lastLeafTime: 0
            };
            break;
          case "🦊": // Frenzy
            this.abilityData = {
              speedStacks: 0
            };
            break;
          case "🐰": // Hopper
            this.abilityData = {
              attachedTo: null,
              attachTime: 0,
              lastHopDistance: 0,
              isCharging: false
            };
            break;
        }
      }

      update() {
        if (this.isDead) return;

        // Handle frozen state
        if (this.frozen && gameTime < this.frozenUntil) {
          return;
        } else {
          this.frozen = false;
        }

        // Handle invulnerability
        if (this.invulnerable && gameTime < this.invulnerableUntil) {
          // Still invulnerable
        } else {
          this.invulnerable = false;
        }

        this.handleMovement();
        this.handleAbilities();
        this.updateStatusEffects();
      }

      handleMovement() {
        // Special movement for Hopper
        if (this.emoji === "🐰") {
          if (this.abilityData.attachedTo && gameTime < this.abilityData.attachTime + 180) {
            // Attached to border for 3 seconds
            return;
          } else if (this.abilityData.attachedTo && gameTime >= this.abilityData.attachTime + 180) {
            // Hop to next border
            this.performHop();
            return;
          }
        }

        // Apply movement modifiers
        let speedMultiplier = 1;
        
        if (this.emoji === "🦊") { // Frenzy
          speedMultiplier += this.abilityData.speedStacks * 0.2;
        }

        if (this.emoji === "🐼" && this.abilityData.boostMode && gameTime < this.abilityData.boostUntil) {
          speedMultiplier *= 5;
          // Drop leaves while in boost mode
          if (gameTime % 60 === 0) { // Every second
            this.dropLeaf();
          }
        }

        if (this.emoji === "🐺" && this.abilityData.buffActive && gameTime < this.abilityData.buffUntil) {
          const interval = Math.max(30, 30 / Math.pow(2, this.abilityData.buffLevel || 0));
          if (gameTime % interval === 0) {
            this.shootMoon();
          }
        }

        // Antarticus execution charge
        if (this.emoji === "🐻‍❄️" && this.abilityData.executionReady) {
          const enemy = this.getNearestEnemy();
          if (enemy) {
            const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
            this.vx = Math.cos(angle) * 10;
            this.vy = Math.sin(angle) * 10;
            speedMultiplier = 5;
          }
        }

        this.x += this.vx * speedMultiplier;
        this.y += this.vy * speedMultiplier;

        // Wall collision
        const r = this.size;
        if (this.x < r) {
          this.x = r;
          this.vx *= -1;
          this.handleWallCollision('left');
        } else if (this.x > canvas.width - r) {
          this.x = canvas.width - r;
          this.vx *= -1;
          this.handleWallCollision('right');
        }

        if (this.y < r) {
          this.y = r;
          this.vy *= -1;
          this.handleWallCollision('top');
        } else if (this.y > canvas.height - r) {
          this.y = canvas.height - r;
          this.vy *= -1;
          this.handleWallCollision('bottom');
        }

        this.angle += 0.05;

        // Drop leaves for Black Spot every 5 seconds
        if (this.emoji === "🐼" && gameTime - this.abilityData.lastLeafTime > 300) {
          this.dropLeaf();
          this.abilityData.lastLeafTime = gameTime;
        }

        // Drop webs for Tricker every 10 seconds
        if (this.emoji === "🎃" && gameTime % 600 === 0) {
          this.abilityData.webs.push({
            x: this.x,
            y: this.y,
            age: 0
          });
        }
      }

      handleWallCollision(side) {
        if (this.emoji === "💀") { // Deathblow
          this.spawnDangerSkull();
        }
        
        if (this.emoji === "🎃") { // Tricker
          this.abilityData.bounceCount++;
          if (this.abilityData.bounceCount === 1 && !this.abilityData.hasClone) {
            this.abilityData.clonePosition = { x: this.x, y: this.y };
            this.abilityData.hasClone = true;
          }
          if (this.abilityData.bounceCount % 3 === 0 && this.abilityData.clonePosition) {
            // Swap with clone
            const temp = { x: this.x, y: this.y };
            this.x = this.abilityData.clonePosition.x;
            this.y = this.abilityData.clonePosition.y;
            this.abilityData.clonePosition = temp;
          }
        }

        if (this.emoji === "🐰") { // Hopper
          // Attach to border
          this.abilityData.attachedTo = side;
          this.abilityData.attachTime = gameTime;
        }
      }

      performHop() {
        // Calculate hop distance
        const oldX = this.x;
        const oldY = this.y;
        
        // Hopper hops to a random border
        const borders = ['left', 'right', 'top', 'bottom'];
        const targetBorder = borders[Math.floor(Math.random() * borders.length)];
        
        switch(targetBorder) {
          case 'left':
            this.x = this.size;
            this.y = Math.random() * (canvas.height - 2 * this.size) + this.size;
            break;
          case 'right':
            this.x = canvas.width - this.size;
            this.y = Math.random() * (canvas.height - 2 * this.size) + this.size;
            break;
          case 'top':
            this.x = Math.random() * (canvas.width - 2 * this.size) + this.size;
            this.y = this.size;
            break;
          case 'bottom':
            this.x = Math.random() * (canvas.width - 2 * this.size) + this.size;
            this.y = canvas.height - this.size;
            break;
        }
        
        this.abilityData.lastHopDistance = Math.hypot(this.x - oldX, this.y - oldY);
        this.abilityData.attachedTo = targetBorder;
        this.abilityData.attachTime = gameTime;
      }

      handleAbilities() {
        const currentTime = gameTime;
        
        // Handle mimicking state
        if (this.emoji !== "🤡" && this.abilityData && this.abilityData.mimicking && currentTime >= this.abilityData.mimicUntil) {
          this.emoji = this.abilityData.originalEmoji;
          this.abilityData.mimicking = false;
        }

        // Handle Gamemaster Game Buster
        if (this.emoji === "👾" && this.abilityData.gameBusterActive) {
          if (currentTime % 30 === 0 && this.abilityData.gameBusterShots < 20) { // Every 0.5 seconds
            this.fireCoin();
            this.abilityData.gameBusterShots++;
            if (this.abilityData.gameBusterShots >= 20) {
              this.abilityData.gameBusterActive = false;
              this.abilityData.gameBusterShots = 0;
            }
          }
          return;
        }

        // Handle Terestro Galactic Overload
        if (this.emoji === "👽" && this.abilityData.overloadActive) {
          if (currentTime % 30 === 0 && this.abilityData.overloadBarrageCount < 3) { // Faster shooting
            this.shootEnhancedStars();
            this.abilityData.overloadBarrageCount++;
            if (this.abilityData.overloadBarrageCount >= 3) {
              this.abilityData.overloadActive = false;
              this.abilityData.overloadBarrageCount = 0;
              this.abilityData.overloadComplete = true;
              this.lastAbilityTime = currentTime + 300; // 5 second delay
            }
          }
          return;
        }

        // Handle Mimic balloon throwing
        if (this.abilityData.mimicking && this.abilityData.balloonCount < 5) {
          if (currentTime % 60 === 0) { // Every second
            this.throwBalloon();
            this.abilityData.balloonCount++;
          }
          return;
        }

        switch(this.emoji) {
          case "😈": // Demonlord
            if (currentTime - this.lastAbilityTime > 180) { // 3 seconds
              this.fireFire();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "👽": // Terestro
            const cooldown = this.abilityData.overloadComplete ? 300 : 180; // 5s after overload, otherwise 3s
            if (currentTime - this.lastAbilityTime > cooldown) {
              this.shootStars();
              this.lastAbilityTime = currentTime;
              this.abilityData.overloadComplete = false;
            }
            break;
            
          case "👾": // Gamemaster
            if (currentTime - this.lastAbilityTime > 180) {
              this.fireCoin();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "🤡": // Mimic
            if (!this.abilityData.hasActiveBall && !this.abilityData.mimicking) {
              this.throwRedBall();
            }
            break;
            
          case "🎃": // Tricker
            if (!this.abilityData.hasBat) {
              this.spawnBat();
            }
            break;
            
          case "👹": // Grinch
            const grinchCooldown = this.abilityData.cooldownReduced ? 180 : 360; // 3s or 6s
            if (currentTime - this.lastAbilityTime > grinchCooldown) {
              this.throwBoulder();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "👼🏻": // Angerus
            if (currentTime - this.lastAbilityTime > 120) { // 2 seconds between blocks
              this.fireBlockSequence();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "🤵🏻": // Magico
            if (currentTime - this.lastAbilityTime > 240) { // 4 seconds for full sequence
              this.throwCards();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "🐯": // Clawhard
            const clawCooldown = this.getClawhardCooldown();
            if (currentTime - this.lastAbilityTime > clawCooldown) {
              this.shootWindslash();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "🐺": // Moonhowl
            if (!this.abilityData.buffActive && currentTime - this.lastAbilityTime > 120) {
              this.shootMoon();
              this.lastAbilityTime = currentTime;
            }
            break;
            
          case "🐻‍❄️": // Antarticus
            if (this.abilityData.executionReady) {
              // Check if close enough to enemy for execution
              const enemy = this.getNearestEnemy();
              if (enemy && Math.hypot(enemy.x - this.x, enemy.y - this.y) < 50) {
                enemy.takeDamage(10, this);
                this.abilityData.frozenHits = 0;
                this.abilityData.executionReady = false;
              }
            } else if (currentTime - this.lastAbilityTime > 180) {
              this.shootFrozeflake();
              this.lastAbilityTime = currentTime;
            }
            break;
        }
      }

      // Ability implementations with correct behaviors
      fireFire() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 3;
        
        const fire = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🔥", 1, this, "fire",
          { wallsHitTracker: this.abilityData.wallsHit, owner: this }
        );
        
        projectiles.push(fire);
        audio.shoot();
      }

      shootStars() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            if (this.isDead) return;
            const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x) + (Math.random() - 0.5) * 0.3;
            const speed = 3;
            const isEnhanced = i === 3;
            
            const star = new Projectile(
              this.x, this.y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              isEnhanced ? "🌟" : "⭐", isEnhanced ? 2 : 1,
              this, "star", { enhanced: isEnhanced }
            );
            
            projectiles.push(star);
            audio.shoot();
          }, i * 100);
        }
      }

      shootEnhancedStars() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            if (this.isDead) return;
            const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x) + (Math.random() - 0.5) * 0.2;
            const speed = 4;
            
            const star = new Projectile(
              this.x, this.y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              "🌟", 2, this, "enhancedStar", { enhanced: true }
            );
            
            projectiles.push(star);
            audio.ability();
          }, i * 50);
        }
      }

      fireCoin() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 2.5;
        
        const coin = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🪙", 1, this, "coin",
          { maxBounces: 3, directHit: true, bounceCount: 0 }
        );
        
        projectiles.push(coin);
        audio.shoot();
      }

      throwRedBall() {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2;
        
        const ball = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🔴", 1, this, "redBall",
          { bounces: 0, maxBounces: 10 }
        );
        
        projectiles.push(ball);
        this.abilityData.hasActiveBall = true;
        audio.shoot();
      }

      throwBalloon() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 3;
        
        const balloon = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🎈", 3, this, "balloon"
        );
        
        projectiles.push(balloon);
        audio.ability();
      }

      spawnBat() {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2;
        
        const bat = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🦇", 1, this, "bat",
          { lifetime: Infinity }
        );
        
        projectiles.push(bat);
        this.abilityData.hasBat = true;
        audio.shoot();
      }

      throwBoulder() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 2;
        
        const boulder = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🪨", 8, this, "boulder",
          { size: this.size * 2, boulderSize: "giant" }
        );
        
        projectiles.push(boulder);
        audio.shoot();
      }

      fireBlockSequence() {
        if (this.abilityData.phase === 'black') {
          const blocks = ["▪️", "◾", "◼️"];
          const damages = [1, 2, 4];
          
          if (this.abilityData.blockIndex >= 3) {
            if (this.abilityData.blackComplete) {
              // Fire enhanced black block
              this.fireEnhancedBlock("🔲", 6, 4);
              this.abilityData.blackComplete = false;
            }
            this.abilityData.phase = 'white';
            this.abilityData.blockIndex = 0;
            return;
          }
        } else {
          const blocks = ["▫️", "◽", "◻️"];
          const heals = [1, 2, 4];
          
          if (this.abilityData.blockIndex >= 3) {
            if (this.abilityData.whiteComplete) {
              // Fire enhanced white block
              this.fireEnhancedBlock("🔳", 4, 6);
              this.abilityData.whiteComplete = false;
            }
            this.abilityData.phase = 'black';
            this.abilityData.blockIndex = 0;
            return;
          }
        }

        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 3;
        
        if (this.abilityData.phase === 'black') {
          const blocks = ["▪️", "◾", "◼️"];
          const damages = [1, 2, 4];
          
          const projectile = new Projectile(
            this.x, this.y,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            blocks[this.abilityData.blockIndex], damages[this.abilityData.blockIndex], 
            this, "angelBlock",
            { phase: 'black', index: this.abilityData.blockIndex }
          );
          
          projectiles.push(projectile);
        } else {
          const blocks = ["▫️", "◽", "◻️"];
          const heals = [1, 2, 4];
          
          const projectile = new Projectile(
            this.x, this.y,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            blocks[this.abilityData.blockIndex], 0, 
            this, "angelBlock",
            { phase: 'white', heal: heals[this.abilityData.blockIndex], index: this.abilityData.blockIndex }
          );
          
          projectiles.push(projectile);
        }
        
        this.abilityData.blockIndex++;
        audio.shoot();
      }

      fireEnhancedBlock(emoji, damage, heal) {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 3;
        
        const enhanced = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          emoji, damage, this, "enhancedBlock", 
          { heal: heal }
        );
        
        projectiles.push(enhanced);
        audio.ability();
      }

      throwCards() {
        const cards = ["♥️", "♠️", "♣️", "♦️"];
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        if (this.abilityData.cardIndex >= 4) {
          this.abilityData.cardIndex = 0;
          this.abilityData.spadeActive = false;
          this.abilityData.clubsActive = false;
        }
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 3;
        
        const card = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          cards[this.abilityData.cardIndex], 0, this, "card",
          { cardType: cards[this.abilityData.cardIndex] }
        );
        
        projectiles.push(card);
        this.abilityData.cardIndex++;
        audio.shoot();
      }

      shootWindslash() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        for (let i = 0; i < this.abilityData.windslashCount; i++) {
          setTimeout(() => {
            if (this.isDead) return;
            const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x) + (i - this.abilityData.windslashCount/2) * 0.1;
            const speed = 4;
            
            const damage = this.hp <= this.maxHp * 0.1 ? 2 : 1;
            const lifesteal = this.hp <= this.maxHp * 0.1;
            
            const windslash = new Projectile(
              this.x, this.y,
              Math.cos(angle) * speed, Math.sin(angle) * speed,
              "🌀", damage, this, "windslash",
              { lifesteal: lifesteal }
            );
            
            projectiles.push(windslash);
          }, i * 50);
        }
        audio.shoot();
      }

      shootMoon() {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5;
        
        const moon = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "🌙", 1, this, "moon"
        );
        
        projectiles.push(moon);
        audio.shoot();
      }

      shootFrozeflake() {
        const enemy = this.getNearestEnemy();
        if (!enemy) return;
        
        const angle = Math.atan2(enemy.y - this.y, enemy.x - this.x);
        const speed = 2;
        
        const frozeflake = new Projectile(
          this.x, this.y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          "❄️", 1, this, "frozeflake",
          { maxBounces: 5, bounces: 0 }
        );
        
        projectiles.push(frozeflake);
        audio.shoot();
      }

      dropLeaf() {
        this.abilityData.leaves.push({
          x: this.x,
          y: this.y,
          age: 0
        });
      }

      spawnDangerSkull() {
        if (this.abilityData.activeSkulls < this.abilityData.enemyHits) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5;
          
          const skull = new Projectile(
            this.x, this.y,
            Math.cos(angle) * speed, Math.sin(angle) * speed,
            "☠️", 1, this, "dangerSkull",
            { lifetime: 600 } // 10 seconds
          );
          
          projectiles.push(skull);
          this.abilityData.activeSkulls++;
        }
      }

      // Helper methods
      getNearestEnemy() {
        let nearest = null;
        let minDistance = Infinity;
        
        charactersInArena.forEach(c => {
          if (c.team !== this.team && !c.isDead) {
            const distance = Math.hypot(c.x - this.x, c.y - this.y);
            if (distance < minDistance) {
              minDistance = distance;
              nearest = c;
            }
          }
        });
        
        return nearest;
      }

      getClawhardCooldown() {
        if (this.abilityData.lifeSurgeUsed) return 120; // Normal after Life Surge used
        
        if (this.hp <= this.maxHp * 0.1) return 15; // 0.25 seconds
        if (this.hp <= this.maxHp * 0.25) return 30; // 0.5 seconds  
        if (this.hp <= this.maxHp * 0.5) return 60; // 1 second
        return 120; // 2 seconds
      }

      updateStatusEffects() {
        // Decay fake HP for spade effect
        if (this.fakeHp > 0) {
          this.fakeHp = Math.max(0, this.fakeHp - 1/60); // 1 HP per second
        }

        // Hell's Trial damage
        if (this.emoji !== "😈" && this.abilityData.hellsTrialActive) {
          if (gameTime % 60 === 0) { // Every second
            const demonlord = charactersInArena.find(c => c.emoji === "😈" && c.team !== this.team && !c.isDead);
            if (demonlord) {
              const damage = Math.min(2, demonlord.abilityData.hellsTrialTriggers);
              this.takeDamage(damage);
            }
          }
        }
      }

      takeDamage(amount, source = null) {
        if (this.isDead || this.invulnerable) return false;
        
        // Handle consecutive damage for Angerus
        if (this.emoji === "👼🏻") {
          const now = gameTime;
          if (now - this.abilityData.lastDamageTime <= 60) { // Within 1 second
            this.abilityData.consecutiveDamage++;
          } else {
            this.abilityData.consecutiveDamage = 1;
          }
          this.abilityData.lastDamageTime = now;
          
          if (this.abilityData.consecutiveDamage >= 20) {
            this.hp = this.maxHp; // Full heal
            this.abilityData.consecutiveDamage = 0;
            return true;
          }
        }
        
        // Apply damage to fake HP first, then real HP
        if (this.fakeHp > 0) {
          const fakeReduction = Math.min(this.fakeHp, amount);
          this.fakeHp -= fakeReduction;
          amount -= fakeReduction;
        }
        
        if (amount > 0) {
          this.hp -= amount;
          if (this.hp <= 0) {
            this.hp = 0;
            this.die();
          }
        }
        
        // Handle character-specific damage responses
        if (source && source.emoji === "🦊") { // Frenzy hit
          source.abilityData.speedStacks++;
        }
        
        if (this.emoji === "🐼") { // Black Spot hit
          this.abilityData.hitCount++;
          if (this.abilityData.hitCount >= 5) {
            this.activateBoostMode();
            this.abilityData.hitCount = 0;
          }
        }

        // Check Life Surge for Clawhard
        if (this.emoji === "🐯" && !this.abilityData.lifeSurgeUsed) {
          if (this.hp <= this.maxHp * 0.25 && this.hp > this.maxHp * 0.1) {
            // Just dropped below 25%, can't use Life Surge again
          } else if (this.hp > this.maxHp * 0.25) {
            this.abilityData.lifeSurgeUsed = false;
          }
        }
        
        return true;
      }

      heal(amount) {
        this.hp = Math.min(this.maxHp, this.hp + amount);
      }

      addFakeHp(amount) {
        this.fakeHp = Math.min(this.maxHp - this.hp, this.fakeHp + amount);
      }

      freeze(duration) {
        this.frozen = true;
        this.frozenUntil = gameTime + duration;
      }

      die() {
        this.isDead = true;
        audio.death();
        
        // Create death animation
        const rect = canvas.getBoundingClientRect();
        const deathAnim = document.createElement('div');
        deathAnim.className = 'death-animation';
        deathAnim.textContent = this.emoji;
        deathAnim.style.left = `${rect.left + this.x}px`;
        deathAnim.style.top = `${rect.top + this.y}px`;
        document.body.appendChild(deathAnim);
        
        setTimeout(() => {
          deathAnim.remove();
        }, 2000);
        
        // Check win condition
        setTimeout(() => {
          checkWinCondition();
        }, 5000); // 5 second delay as specified
      }

      activateBoostMode() {
        // Fly all leaves toward Black Spot
        this.abilityData.leaves.forEach(leaf => {
          const leafProjectile = new Projectile(
            leaf.x, leaf.y,
            (this.x - leaf.x) * 0.1, (this.y - leaf.y) * 0.1,
            "🌿", 3, this, "leaf"
          );
          projectiles.push(leafProjectile);
          this.heal(5);
        });
        this.abilityData.leaves = [];
        
        // Activate boost
        this.abilityData.boostMode = true;
        this.abilityData.boostUntil = gameTime + 480; // 8 seconds
        this.invulnerable = true;
        this.invulnerableUntil = gameTime + 480;
      }

      draw(ctx) {
        if (this.isDead) return;
        
        ctx.save();
        
        // Glow effect for special states
        if (this.invulnerable) {
          ctx.shadowColor = "#ffffff";
          ctx.shadowBlur = 10;
        }
        
        if (this.frozen) {
          ctx.shadowColor = "#00ffff";
          ctx.shadowBlur = 8;
        }
        
        if (this.abilityData.boostMode && gameTime < this.abilityData.boostUntil) {
          ctx.shadowColor = "#ffff00";
          ctx.shadowBlur = 12;
        }
        
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.font = `${this.size * 2}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.fillText(this.emoji, 0, 0);
        
        ctx.restore();
        
        // Draw special elements
        this.drawSpecialElements(ctx);
      }

      drawSpecialElements(ctx) {
        // Draw leaves for Black Spot
        if (this.emoji === "🐼") {
          this.abilityData.leaves.forEach(leaf => {
            ctx.font = "16px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🌿", leaf.x, leaf.y);
          });
        }
        
        // Draw webs for Tricker
        if (this.emoji === "🎃") {
          this.abilityData.webs.forEach(web => {
            ctx.font = "20px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🕸️", web.x, web.y);
          });
        }

        // Draw clone for Tricker
        if (this.emoji === "🎃" && this.abilityData.clonePosition) {
          ctx.save();
          ctx.globalAlpha = 0.3;
          ctx.font = "32px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🎃", this.abilityData.clonePosition.x, this.abilityData.clonePosition.y);
          ctx.restore();
        }

        // Draw blood drops for Grinch
        if (this.emoji === "👹") {
          this.abilityData.bloodDrops.forEach(drop => {
            ctx.font = "12px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🩸", drop.x, drop.y);
          });
        }

        // Draw pride members for Kingstone
        if (this.emoji === "🦁") {
          this.abilityData.pride.forEach(member => {
            if (!member.isDead) {
              ctx.font = "24px serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("🦁", member.x, member.y);
            }
          });
        }
      }
    }

    function selectCharacter(char, team) {
      console.log('Selecting character:', char.name, 'for team', team);
      
      if (team === 1) {
        const index = selectedP1.findIndex(c => c.emoji === char.emoji);
        if (index !== -1) {
          selectedP1.splice(index, 1);
          console.log('Removed from P1:', char.name);
        } else if (selectedP1.length < 5 && !selectedP2.some(c => c.emoji === char.emoji)) {
          selectedP1.push(char);
          console.log('Added to P1:', char.name);
        }
      } else if (team === 2) {
        const index = selectedP2.findIndex(c => c.emoji === char.emoji);
        if (index !== -1) {
          selectedP2.splice(index, 1);
          console.log('Removed from P2:', char.name);
        } else if (selectedP2.length < 5 && !selectedP1.some(c => c.emoji === char.emoji)) {
          selectedP2.push(char);
          console.log('Added to P2:', char.name);
        }
      }
      
      updateDisplay();
    }

    function updateDisplay() {
      // Update counters
      document.getElementById('p1Count').textContent = selectedP1.length;
      document.getElementById('p2Count').textContent = selectedP2.length;
      
      // Update button highlights
      document.querySelectorAll('.char-btn').forEach(btn => {
        btn.classList.remove('selected-p1', 'selected-p2');
        const emoji = btn.textContent;
        
        if (selectedP1.some(c => c.emoji === emoji)) {
          btn.classList.add('selected-p1');
        }
        if (selectedP2.some(c => c.emoji === emoji)) {
          btn.classList.add('selected-p2');
        }
      });
      
      // Update start button
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = selectedP1.length === 0 || selectedP2.length === 0;
      
      console.log('Display updated. P1:', selectedP1.length, 'P2:', selectedP2.length);
    }

    function startGame() {
      if (selectedP1.length === 0 || selectedP2.length === 0) {
        alert('Please select at least one character for each team!');
        return;
      }
      
      console.log('Starting game with:', selectedP1.map(c => c.name), 'vs', selectedP2.map(c => c.name));
      
      // Initialize audio context
      if (audio.audioContext.state === 'suspended') {
        audio.audioContext.resume();
      }
      
      // Hide selection overlay and show arena
      document.getElementById('characterSelect').style.display = 'none';
      document.querySelector('.arena-container').style.display = 'flex';
      
      // Set match info
      const info = selectedP1.length > 1 || selectedP2.length > 1 ?
        `Team 1 (${selectedP1.length}) vs Team 2 (${selectedP2.length})` : 
        `${selectedP1[0].emoji} VS ${selectedP2[0].emoji}`;
      document.getElementById('matchInfo').textContent = info;
      
      // Create HP displays
      createHPDisplays();
      
      // Initialize canvas
      canvas = document.getElementById('arena');
      canvas.width = Math.min(window.innerWidth * 0.9, 1000);
      canvas.height = Math.min(window.innerHeight * 0.6, 600);
      ctx = canvas.getContext('2d');
      
      // Create characters
      charactersInArena = [];
      projectiles = [];
      gameTime = 0;
      
      // Position team 1
      const gapX1 = canvas.width / (selectedP1.length + 1);
      selectedP1.forEach((char, i) => {
        charactersInArena.push(new ArenaCharacter(
          char.emoji, char.name,
          gapX1 * (i + 1), canvas.height * 0.2, 1
        ));
      });
      
      // Position team 2
      const gapX2 = canvas.width / (selectedP2.length + 1);
      selectedP2.forEach((char, i) => {
        charactersInArena.push(new ArenaCharacter(
          char.emoji, char.name,
          gapX2 * (i + 1), canvas.height * 0.8, 2
        ));
      });
      
      gameRunning = true;
      requestAnimationFrame(gameLoop);
    }

            </div>
          </div>
          <div class="status-indicators"></div>
        `;
        hp1.appendChild(div);
      });
      
      selectedP2.forEach(char => {

          <div class="hp-bar-container">
            <div class="hp-bar">
              <div class="hp-fill" style="width: 100%"></div>
              <div class="hp-fake" style="width: 0%"></div>

            </div>

    function updateHPDisplays() {
      const hp1Elements = document.querySelectorAll("#player1HP .character-status");
      const hp2Elements = document.querySelectorAll("#player2HP .character-status");
      
      selectedP1.forEach((char, i) => {
        const character = charactersInArena.find(c => c.emoji === char.emoji && c.team === 1);
        if (character && hp1Elements[i]) {
          updateCharacterStatus(hp1Elements[i], character);
        }
      });
      
      selectedP2.forEach((char, i) => {
        const character = charactersInArena.find(c => c.emoji === char.emoji && c.team === 2);
        if (character && hp2Elements[i]) {
          updateCharacterStatus(hp2Elements[i], character);
        }
      });
    }

    function updateCharacterStatus(element, character) {
      const hpFill = element.querySelector('.hp-fill');
      const hpFake = element.querySelector('.hp-fake');
      const hpShield = element.querySelector('.hp-shield');
      const statusIndicators = element.querySelector('.status-indicators');
      
      const hpPercentage = (character.hp / character.maxHp) * 100;
      const fakePercentage = (character.fakeHp / character.maxHp) * 100;
      const shieldPercentage = (character.shield / character.maxHp) * 100;
      
      hpFill.style.width = `${hpPercentage}%`;
      hpFake.style.width = `${fakePercentage}%`;
      hpShield.style.width = `${shieldPercentage}%`;
      
      // Update status indicators
      statusIndicators.innerHTML = "";
      
      if (character.frozen) {
        const indicator = document.createElement('span');
        indicator.className = 'status-indicator';
        indicator.textContent = '❄️';
        indicator.title = 'Frozen';
        statusIndicators.appendChild(indicator);
      }
      
      if (character.invulnerable) {
        const indicator = document.createElement('span');
        indicator.className = 'status-indicator';
        indicator.textContent = '🛡️';
        indicator.title = 'Invulnerable';
        statusIndicators.appendChild(indicator);
      }
      
      if (character.abilityData.boostMode) {
        const indicator = document.createElement('span');
        indicator.className = 'status-indicator';
        indicator.textContent = '⚡';
        indicator.title = 'Boost Mode';
        statusIndicators.appendChild(indicator);
      }
      
      if (character.isDead) {
        element.style.opacity = '0.3';
      }
    }

    const MAX_SPEED = 3;
    const BUMP_FORCE = 0.5;
    const FRICTION = 0.98;

    function gameLoop() {
      if (!gameRunning) return;
      
      gameTime++;
      
      // Clear canvas with Hell's Trial effect
      const hellsTrialActive = charactersInArena.some(c => 
        c.emoji === "😈" && c.abilityData.hellsTrialActive && !c.isDead
      );
      
      if (hellsTrialActive) {
        ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + Math.sin(gameTime * 0.1) * 0.05})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      
      // Update and draw characters
      charactersInArena.forEach(c => {
        if (!c.isDead) {
          // Apply friction
          c.vx *= FRICTION;
          c.vy *= FRICTION;
          
          // Cap speed
          const speed = Math.hypot(c.vx, c.vy);
          if (speed > MAX_SPEED) {
            const angle = Math.atan2(c.vy, c.vx);
            c.vx = Math.cos(angle) * MAX_SPEED;
            c.vy = Math.sin(angle) * MAX_SPEED;
          }
          
          c.update();
          c.draw(ctx);
        }
      });
      
      // Update projectiles
      projectiles = projectiles.filter(p => {
        if (!p.update()) return false;
        
        // Check collision with characters
        charactersInArena.forEach(char => {
          if (char.isDead) return;
          if (char === p.owner && !p.canHitOwner) return;
          if (p.checkCollision(char)) {
            handleProjectileHit(p, char);
          }
        });
        
        // Handle special projectile behaviors
        if (p.type === "leo" && p.checkCollision(p.owner)) {
          // Leo hits Kingstone - evolve into Pride member
          const prideMember = {
            x: p.x,
            y: p.y,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            hp: 10 + p.owner.abilityData.pride.length * 5,
            maxHp: 10 + p.owner.abilityData.pride.length * 5,
            isDead: false,
            size: 16
          };
          p.owner.abilityData.pride.push(prideMember);
          
          // Boost all pride members
          p.owner.abilityData.pride.forEach(member => {
            member.hp += 5;
            member.maxHp += 5;
          });
          
          // Grow Kingstone
          p.owner.size = p.owner.originalSize * (1 + p.owner.abilityData.pride.length * 0.2);
          
          return false; // Remove Leo
        }
        
        // Check coin fusion for Gamemaster
        if (p.type === "coin") {
          projectiles.forEach(other => {
            if (other !== p && other.type === "coin" && p.checkCollision(other)) {
              // Create bank
              const bank = new Projectile(
                (p.x + other.x) / 2, (p.y + other.y) / 2,
                0, 0, "💰", 0, p.owner, "bank"
              );
              projectiles.push(bank);
              
              // Remove both coins
              const pIndex = projectiles.indexOf(p);
              const otherIndex = projectiles.indexOf(other);
              if (pIndex > -1) projectiles.splice(pIndex, 1);
              if (otherIndex > -1) projectiles.splice(otherIndex, 1);
              
              return false;
            }
          });
        }
        
        // Handle bank collection
        if (p.type === "bank" && p.checkCollision(p.owner)) {
          p.owner.abilityData.gameBusterActive = true;
          return false;
        }
        
        p.draw(ctx);
        return true;
      });
      
      // Update pride members for Kingstone
      charactersInArena.forEach(c => {
        if (c.emoji === "🦁" && c.abilityData.pride) {
          c.abilityData.pride.forEach(member => {
            if (!member.isDead) {
              // Move pride members
              member.x += member.vx;
              member.y += member.vy;
              
              // Bounce off walls
              if (member.x <= 16 || member.x >= canvas.width - 16) {
                member.vx *= -1;
                member.x = Math.max(16, Math.min(canvas.width - 16, member.x));
              }
              if (member.y <= 16 || member.y >= canvas.height - 16) {
                member.vy *= -1;
                member.y = Math.max(16, Math.min(canvas.height - 16, member.y));
              }
            }
          });
        }
      });
      
      // Handle character collisions
      handleCharacterCollisions();
      
      // Update HP displays
      updateHPDisplays();
      
      requestAnimationFrame(gameLoop);
    }

    function handleCharacterCollisions() {
      const CHARACTER_RADIUS = 16;
      const MIN_DISTANCE = CHARACTER_RADIUS * 2;
      
      for (let i = 0; i < charactersInArena.length; i++) {
        for (let j = i + 1; j < charactersInArena.length; j++) {
          const a = charactersInArena[i];
          const b = charactersInArena[j];
          
          if (a.isDead || b.isDead) continue;
          
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const distance = Math.hypot(dx, dy);
          
          if (distance < MIN_DISTANCE) {
            const angle = Math.atan2(dy, dx);
            const overlap = MIN_DISTANCE - distance;
            
            // Push apart
            const pushX = Math.cos(angle) * (overlap / 2);
            const pushY = Math.sin(angle) * (overlap / 2);
            a.x += pushX;
            a.y += pushY;
            b.x -= pushX;
            b.y -= pushY;
            
            // Clamp positions
            a.x = Math.max(CHARACTER_RADIUS, Math.min(canvas.width - CHARACTER_RADIUS, a.x));
            a.y = Math.max(CHARACTER_RADIUS, Math.min(canvas.height - CHARACTER_RADIUS, a.y));
            b.x = Math.max(CHARACTER_RADIUS, Math.min(canvas.width - CHARACTER_RADIUS, b.x));
            b.y = Math.max(CHARACTER_RADIUS, Math.min(canvas.height - CHARACTER_RADIUS, b.y));
            
            // Apply bump force
            a.vx = (a.vx + Math.cos(angle) * BUMP_FORCE) * 0.8;
            a.vy = (a.vy + Math.sin(angle) * BUMP_FORCE) * 0.8;
            b.vx = (b.vx - Math.cos(angle) * BUMP_FORCE) * 0.8;
            b.vy = (b.vy - Math.sin(angle) * BUMP_FORCE) * 0.8;
            
            // Handle collision-based abilities
            if (a.team !== b.team) {
              handleCharacterHit(a, b);
              handleCharacterHit(b, a);
            }
          }
        }
        
        // Check collision with hopper radius
        const char = charactersInArena[i];
        if (char.emoji === "🐰" && !char.isDead) {
          charactersInArena.forEach(other => {
            if (other !== char && !other.isDead && other.team !== char.team) {
              const distance = Math.hypot(other.x - char.x, other.y - char.y);
              if (distance <= char.size * 5) { // 5x radius
                const damage = calculateHopperDamage(char, other, false);
                other.takeDamage(damage, char);
                other.statusEffects.set('stunned', { duration: 60 }); // 1 second stun
              }
            }
          });
        }
      }
    }

    function handleCharacterHit(attacker, victim) {
      if (victim.isDead || victim.invulnerable) return;
      
      let damage = 1;
      
      // Character-specific damage calculations
      if (attacker.emoji === "💀") { // Deathblow
        damage = 3;
        attacker.abilityData.enemyHits++;
      } else if (attacker.emoji === "🦁") { // Kingstone
        damage = 1 + attacker.abilityData.pride.length;
        attacker.abilityData.enemyHits++;
        // Spawn Leo
        spawnLeo(attacker);
      } else if (attacker.emoji === "🦊") { // Frenzy
        damage = Math.pow(2, Math.floor(attacker.abilityData.speedStacks / 5));
        attacker.abilityData.speedStacks++;
      } else if (attacker.emoji === "🐰") { // Hopper
        damage = calculateHopperDamage(attacker, victim, true);
        // Treat enemy as border for hopper
        attacker.abilityData.attachedTo = "enemy";
        attacker.abilityData.attachTime = gameTime;
      } else if (attacker.emoji === "🐼") { // Black Spot
        if (attacker.abilityData.boostMode && gameTime < attacker.abilityData.boostUntil) {
          damage = 5; // Boost mode damage
        } else {
          damage = 1;
        }
      }
      
      victim.takeDamage(damage, attacker);
      audio.hit();
    }

    function spawnLeo(kingstone) {
      // Add Leo to projectiles that will evolve into pride member
      const leo = new Projectile(
        kingstone.x, kingstone.y,
        (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
        "♌", 0, kingstone, "leo",
        { canHitOwner: true }
      );
      projectiles.push(leo);
      audio.shoot();
    }

    function calculateHopperDamage(hopper, victim, isDirect) {
      const distance = hopper.abilityData.lastHopDistance || canvas.width * 0.5;
      const arenaSize = Math.hypot(canvas.width, canvas.height);
      
      if (distance >= arenaSize * 0.8) { // Long hop
        return isDirect ? 8 : 6;
      } else if (distance >= arenaSize * 0.4) { // Medium hop
        return isDirect ? 5 : 3;
      } else { // Short hop
        return isDirect ? 2 : 1;
      }
    }

    function handleProjectileHit(projectile, character) {
      if (character.isDead || character.invulnerable) return;
      
      let damage = projectile.damage;
      let removeProjectile = true;
      
      // Handle specific projectile types
      switch(projectile.type) {
        case "fire":
          // Calculate Hell's Trial multiplier
          const fireOwner = projectile.owner;
          const multiplier = fireOwner.abilityData.hellsTrialTriggers || 1;
          const totalDamage = damage * multiplier;
          character.takeDamage(totalDamage, projectile.owner);
          
          // Apply burn effect (1 damage after delay)
          setTimeout(() => {
            if (!character.isDead) {
              character.takeDamage(1);
            }
          }, 1000);
          break;
          
        case "star":
        case "enhancedStar":
          if (projectile.data.enhanced) {
            projectile.owner.abilityData.enhancedStarHits++;
            if (projectile.owner.abilityData.enhancedStarHits >= 3) {
              // Trigger Galactic Overload
              projectile.owner.abilityData.overloadActive = true;
              projectile.owner.abilityData.enhancedStarHits = 0;
            }
          }
          character.takeDamage(damage, projectile.owner);
          break;
          
        case "coin":
          if (character === projectile.owner) {
            // Gamemaster caught his own coin
            projectile.owner.abilityData.coinsCollected++;
            if (projectile.owner.abilityData.coinsCollected >= 20) {
              projectile.owner.abilityData.gameBusterActive = true;
              projectile.owner.abilityData.coinsCollected = 0;
            }
            removeProjectile = true;
            return;
          } else {
            // Hit enemy
            const isJackpotStrike = projectile.data.bounceCount === 0;
            const finalDamage = isJackpotStrike ? 2 : 1;
            character.takeDamage(finalDamage, projectile.owner);
            if (isJackpotStrike) {
              projectile.owner.heal(1);
            }
          }
          break;
          
        case "redBall":
          const mimicOwner = projectile.owner;
          let ballDamage = 1;
          
          if (projectile.data.bounces >= 9) { // 10th bounce (0-indexed)
            ballDamage = 5; // 10th Impact
          }
          
          character.takeDamage(ballDamage, projectile.owner);
          projectile.data.bounces++;
          
          // Greatest Mimicry
          if (character !== mimicOwner && mimicOwner.emoji === "🤡" && !mimicOwner.abilityData.mimicking) {
            const now = gameTime;
            if (now - mimicOwner.abilityData.lastMimicTime > 600) { // 10 second cooldown
              mimicOwner.abilityData.mimicking = true;
              mimicOwner.abilityData.mimicUntil = now + 300; // 5 seconds
              mimicOwner.abilityData.lastMimicTime = now;
              mimicOwner.abilityData.originalEmoji = mimicOwner.emoji;
              mimicOwner.emoji = character.emoji; // Transform
              mimicOwner.abilityData.balloonCount = 0;
              mimicOwner.invulnerable = true;
              mimicOwner.invulnerableUntil = now + 300;
            }
          }
          
          if (projectile.data.bounces >= 10) {
            mimicOwner.abilityData.hasActiveBall = false;
            removeProjectile = true;
          } else {
            removeProjectile = false;
          }
          break;
          
        case "bat":
          // Check if enemy is on web
          const trickerOwner = projectile.owner;
          let isOnWeb = false;
          trickerOwner.abilityData.webs.forEach((web, index) => {
            const distance = Math.hypot(character.x - web.x, character.y - web.y);
            if (distance < 30) { // Web trap radius
              isOnWeb = true;
              character.freeze(300); // 5 seconds
              trickerOwner.abilityData.webs.splice(index, 1); // Remove web
            }
          });
          
          const batDamage = isOnWeb ? 5 : 1;
          character.takeDamage(batDamage, projectile.owner);
          removeProjectile = false; // Bat continues bouncing
          break;
          
        case "boulder":
          character.takeDamage(damage, projectile.owner);
          
          // Spawn blood drops at impact
          const bloodCount = projectile.data.boulderSize === "giant" ? 4 : 
                            projectile.data.boulderSize === "medium" ? 2 : 1;
          
          for (let i = 0; i < bloodCount; i++) {
            projectile.owner.abilityData.bloodDrops.push({
              x: character.x + (Math.random() - 0.5) * 40,
              y: character.y + (Math.random() - 0.5) * 40,
              age: 0
            });
          }
          break;
          
        case "dangerSkull":
          if (character === projectile.owner) {
            removeProjectile = true; // Disappear when hitting owner
            projectile.owner.abilityData.activeSkulls--;
          } else {
            character.takeDamage(damage, projectile.owner);
          }
          break;
          
        case "balloon":
          character.takeDamage(damage, projectile.owner);
          break;
          
        case "angelBlock":
          if (projectile.data.phase === 'black') {
            character.takeDamage(damage, projectile.owner);
            // Track if this completes black sequence
            if (projectile.data.index === 2) { // Last block in sequence
              projectile.owner.abilityData.blackComplete = true;
            }
          } else {
            // White blocks heal owner
            projectile.owner.heal(projectile.data.heal);
            if (projectile.data.index === 2) { // Last block in sequence
              projectile.owner.abilityData.whiteComplete = true;
            }
          }
          break;
          
        case "enhancedBlock":
          character.takeDamage(damage, projectile.owner);
          if (projectile.data.heal) {
            projectile.owner.heal(projectile.data.heal);
          }
          break;
          
        case "card":
          handleCardEffect(projectile, character);
          break;
          
        case "windslash":
          character.takeDamage(damage, projectile.owner);
          if (projectile.data.lifesteal) {
            projectile.owner.heal(1);
          }
          projectile.owner.abilityData.enemyHits++;
          if (projectile.owner.abilityData.enemyHits % 3 === 0) {
            projectile.owner.abilityData.windslashCount++;
          }
          break;
          
        case "moon":
          character.takeDamage(damage, projectile.owner);
          projectile.owner.abilityData.moonHits++;
          if (projectile.owner.abilityData.moonHits >= 3) {
            // Remove all moons and trigger Full Moon
            projectiles = projectiles.filter(p => p.type !== "moon");
            triggerFullMoon(projectile.owner);
            projectile.owner.abilityData.moonHits = 0;
          }
          break;
          
        case "fullMoon":
          if (character === projectile.owner) {
            // Hit Moonhowl - buff mode
            projectile.owner.abilityData.buffActive = true;
            projectile.owner.abilityData.buffUntil = gameTime + 720; // 12 seconds
            projectile.owner.size = projectile.owner.originalSize * 2;
            projectile.owner.abilityData.buffLevel = (projectile.owner.abilityData.buffLevel || 0) + 1;
          } else {
            // Hit enemy - 8 damage
            character.takeDamage(8, projectile.owner);
          }
          break;
          
        case "frozeflake":
          if (!character.frozen) {
            const freezeDuration = (projectile.owner.abilityData.frozenHits + 1) * 60 + 180; // 3+ seconds
            character.freeze(freezeDuration);
            
            // 1 damage per second while frozen
            const damageInterval = setInterval(() => {
              if (character.frozen && !character.isDead) {
                character.takeDamage(1, projectile.owner);
              } else {
                clearInterval(damageInterval);
              }
            }, 1000);
            
            projectile.owner.abilityData.frozenHits++;
            
            if (projectile.owner.abilityData.frozenHits >= 10) {
              projectile.owner.abilityData.executionReady = true;
            }
          } else {
            removeProjectile = false; // Bounce off frozen enemy
          }
          break;
          
        case "leaf":
          character.takeDamage(damage, projectile.owner);
          character.freeze(60); // 1 second stun
          break;
      }
      
      if (removeProjectile) {
        const index = projectiles.indexOf(projectile);
        if (index > -1) {
          projectiles.splice(index, 1);
        }
      }
      
      audio.hit();
    }

    function triggerFullMoon(moonhowl) {
      const fullMoon = new Projectile(
        moonhowl.x, moonhowl.y,
        (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4,
        "🌕", 8, moonhowl, "fullMoon"
      );
      projectiles.push(fullMoon);
      audio.ability();
    }

    function handleCardEffect(projectile, character) {
      const cardType = projectile.data.cardType;
      
      switch(cardType) {
        case "♥️": // Hearts
          if (projectile.owner.hp >= projectile.owner.maxHp) {
            character.takeDamage(5, projectile.owner); // Full HP = damage enemy
          } else {
            const healAmount = Math.floor(projectile.owner.hp * 0.5);
            projectile.owner.heal(healAmount);
          }
          break;
          
        case "♠️": // Spades
          const fakeHp = Math.floor(character.hp * 0.5);
          character.addFakeHp(fakeHp);
          projectile.owner.abilityData.spadeActive = true;
          break;
          
        case "♣️": // Clubs
          if (projectile.owner.abilityData.spadeActive) {
            character.freeze(600); // 10 seconds
          } else {
            character.freeze(180); // 3 seconds
          }
          projectile.owner.abilityData.clubsActive = true;
          break;
          
        case "♦️": // Diamonds
          if (projectile.owner.abilityData.spadeActive) {
            const fakeDamage = character.fakeHp;
            character.fakeHp = 0;
            character.takeDamage(fakeDamage, projectile.owner);
          } else {
            character.takeDamage(3, projectile.owner);
          }
          break;
      }
    }

    function checkWinCondition() {
      const team1Alive = charactersInArena.filter(c => c.team === 1 && !c.isDead);
      const team2Alive = charactersInArena.filter(c => c.team === 2 && !c.isDead);
      
      if (team1Alive.length === 0 || team2Alive.length === 0) {
        gameRunning = false;
        
        const winner = team1Alive.length > 0 ? "🟢 Player 1" : "🔵 Player 2";
        document.getElementById("winnerText").textContent = `${winner} Wins!`;
        
        setTimeout(() => {
          document.getElementById("gameOver").classList.add("show");
        }, 2000);
      }
    }

    function resetGame() {
      gameRunning = false;
      charactersInArena = [];
      projectiles = [];
      gameTime = 0;
      
      document.getElementById('gameOver').classList.remove('show');
      document.getElementById('characterSelect').style.display = 'flex';
      document.querySelector('.arena-container').style.display = 'none';
      
      selectedP1 = [];
      selectedP2 = [];
      updateDisplay();
    }

    // Initialize the game
    console.log('Initializing game...');
    createCharacterGrid('player1Chars', 1);
    createCharacterGrid('player2Chars', 2);
    updateDisplay();
    console.log('Game initialized!');
  </script>
</body>
